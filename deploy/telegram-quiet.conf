# systemd drop-in: mute this service's @Hyperfadebot messages (telegram_notify.TELEGRAM_QUIET).
# Install for a unit:  mkdir -p /etc/systemd/system/UNIT.service.d && install -m 0644 deploy/telegram-quiet.conf /etc/systemd/system/UNIT.service.d/ && systemctl daemon-reload && systemctl restart UNIT
# Unmute: rm /etc/systemd/system/UNIT.service.d/telegram-quiet.conf && systemctl daemon-reload && systemctl restart UNIT
[Service]
Environment=TELEGRAM_QUIET=1
